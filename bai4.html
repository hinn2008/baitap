<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tính số ngày trong tháng</title>
    <style>
        .box { width: 380px; border: 2px solid #333; padding: 12px 16px; margin: 40px auto; font-family: "Times New Roman", serif; }
        input[type=number] { width: 170px; padding: 4px; }
        #ketqua { font-size: 20px; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="box">
        <input type="number" id="thang" placeholder="Nhập tháng (1-12)">
        <button onclick="tinhSoNgay()">Tính số ngày</button>
        <p id="ketqua"></p>
    </div>

    <script>
        function tinhSoNgay() {
            let thang = parseInt(document.getElementById("thang").value);
            let kq;
            switch (thang) {
                case 1: case 3: case 5: case 7: case 8: case 10: case 12:
                    kq = "Tháng " + thang + " có 31 ngày"; break;
                case 2:
                    kq = "Tháng 2 có 28 hoặc 29 ngày"; break;
                case 4: case 6: case 9: case 11:
                    kq = "Tháng " + thang + " có 30 ngày"; break;
                default:
                    kq = "Tháng không hợp lệ (nhập từ 1 đến 12)";
            }
            document.getElementById("ketqua").innerText = kq;
        }
    </script>
</body>
</html>
