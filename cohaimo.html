<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Định dạng tổng hợp</title>
</head>
<body>
    <!-- Tiêu đề: in hoa, canh giữa -->
    <h2 align="center">CÔ HÁI MƠ</h2>

    <!-- Thẻ pre: giữ nguyên xuống dòng, không rớt dòng khi cửa sổ hẹp. Mỗi câu thơ: in nghiêng -->
    <pre>
<i>(Câu thơ 1 - chép từ Hình 1.7)</i>
<i>(Câu thơ 2 - chép từ Hình 1.7)</i>
<i>(Câu thơ 3 - chép từ Hình 1.7)</i>
<i>(Câu thơ 4 - chép từ Hình 1.7)</i>
</pre>

    <!-- Dòng tác giả: "Tác giả" gạch chân, tên cũ gạch ngang, tên mới in đậm -->
    <p><u>Tác giả</u>: <s>Vô danh</s> <b>Cô hái mơ</b>.</p>
</body>
</html>
